<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Renn-Detail – F1 Kick Tip 2026</title>
  <meta name="description" content="Renn-Tipps und Ergebnisse im F1 Tippspiel 2026">
  <meta name="theme-color" content="#E10600">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
  <style>html{background:#0E0F14;color:#F2F3F7}@media (prefers-color-scheme: light){html{background:#F4F5F8;color:#12131A}}body{opacity:0}</style>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="rennen">

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-logo" aria-label="F1 Kick Tip 2026 – Startseite">
        <span class="logo-f1">F1</span><span class="logo-text">Kick Tip</span><span class="logo-year">2026</span>
      </a>
      <nav class="site-nav" aria-label="Hauptnavigation">
        <ul class="nav-links">
          <li><a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Dashboard</span></a></li>
          <li><a href="saison.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2.5h6v3H9z"/><path d="m9 13 2 2 4-4"/></svg><span>Tipps</span></a></li>
          <li><a href="regeln.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M9 9h6M9 13h6"/></svg><span>Regeln</span></a></li>
        </ul>
      </nav>
      <ul class="header-actions"></ul>
    </div>
    <div class="container"><div id="header-info"><div class="header-info">&nbsp;</div></div></div>
  </header>

  <main class="container">
    <div id="race-content">

      <!-- Race Header -->
      <div id="race-header">
        <div class="loading-state">
          <div class="loading-spinner"></div>
          <div class="loading-text">Lade Renndaten...</div>
        </div>
      </div>

      <!-- Countdown -->
      <section class="section">
        <div id="race-countdown"></div>
      </section>

      <!-- Tip Form (shown when deadline is open) -->
      <section class="section">
        <div id="tip-form-section"></div>
      </section>

      <!-- Sprint Tip Form (shown when sprint deadline is open) -->
      <section class="section">
        <div id="sprint-tip-form-section"></div>
      </section>

      <!-- Race Predictions Comparison -->
      <section class="section">
        <h2 class="section-title">Tipp-Vergleich</h2>
        <div class="card table-card">
          <div id="race-predictions" class="loading">Lade Tipps...</div>
        </div>
      </section>

      <!-- Sprint Predictions (conditional) -->
      <section class="section" id="sprint-predictions-section" style="display: none;">
        <div class="card table-card">
          <div id="sprint-predictions"></div>
        </div>
      </section>

      <!-- Race Result -->
      <section class="section">
        <div id="race-result"></div>
      </section>

      <!-- Points Breakdown -->
      <section class="section">
        <div id="points-breakdown"></div>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      F1 Kick Tip 2026 &middot; Thomas, Julia & Viktor &middot;
      <a href="index.html">Zurück zum Dashboard</a> &middot;
      <a href="test-rennen.html" style="opacity: 0.5;">Test-Modus</a>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
